<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

    @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      :root {
        --blue:rgba(31, 107, 255, 1);
        --blue-dak:rgba(15, 78, 216, 1);
        --yellow:#ffd84d;
        --aqua:#23d7c6;
        --white:#ffffff;
      }

      body {
        margin: 0;
        padding:0;
        min-height: 100vh; /* Asegura que cubra toda la pantalla */

        /* 2. Aplicamos el degradado usando la variable */
        background: linear-gradient(var(--angle), rgba(31, 107, 255, 1), rgb(14, 34, 145));
        background-attachment: fixed; /* Evita que el fondo se mueva al hacer scroll */

        /* 3. Animación de 1 segundo en bucle infinito */
        animation: rotateBackground 10s ease-in-out infinite;
        font-family: Arial, Helvetica, sans-serif;
        /* background: linear-gradient(160deg, rgba(31, 107, 255, 1), rgba(15, 78, 216, 1)); */
        color: var(--white);
        display: flex;
        justify-content:center;
        align-items:center;
        height:100vh;
      }
      
      @keyframes rotateBackground {
        to {
          --angle: 360deg;
        }
      }
      .protected {
        -moz-user-select: -moz-none;
        -khtml-user-select: none;
        -webkit-user-select: none;
        -o-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
      }
.container {
  position: absolute;
  text-align: center;
  color: white;
}
.centered {
  position: absolute;
  top: 75%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
}
button {
  padding: 10px 10px;
  border-radius: 45px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s ease;
  display: flex;
  align-items: center;
}

  /* JOIN (secondary) */
  .btn-join {
    background: transparent;
    border: 2px solid #1ED6C3;
    color: white;
}

  .btn-join:hover {
    background: rgba(30, 214, 195, 0.1);
    transform: scale(1.03);
  }

  /* CREATE (primary) */
  .btn-create {
    background: #1ED6C3;
    border: none;
    color: white;
  }

  .btn-create:hover {
    background: #adcf17;
    transform: scale(1.05);
  }


  #splashModal {
  border: none;
  border-radius: 20px; 
  padding: 2rem;
  background: white;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  max-width: 50vh;
  text-align: center;
}
#splashModal[open] {
  animation: splash 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
#splashModal::backdrop {
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px); /* Opcional: desenfoque */
}
@keyframes splash {
  from {
    opacity: 0;
    transform: scale(0.5); /* Inicia pequeño */
  }
  to {
    opacity: 1;
    transform: scale(1); /* Crece a su tamaño original con rebote */
  }
}
</style>
</head>
<body style="background-color:blue;">


<div class="container">
  <img class="protected" src="https://dvnielzuniga.github.io/VS_logo.png" alt="Snow" style="width:100%;">
  
  <div class="centered buttons">
  <button class="btn btn-join" onclick="window.open('http://www.instagram.com/dvnielzuniga');"><img class="protected" src="https://img.icons8.com/?size=30&id=32292&format=png&color=ffffff"></button>
    <button class="btn btn-join" onclick="window.open('http://github.com/dvnielzuniga/vaquita-split');"><img class="protected" src="https://img.icons8.com/?size=30&id=zehXPLJSAbBB&format=png&color=ffffff"></button>
  </div>
</div>

<div class=" buttons">
<dialog id="splashModal">
    <div class="centered buttons">
  <button class="btn btn-join" onclick="window.open('http://github.com/dvnielzuniga/vaquita-split');"><a style="color: black; padding-left: 1px; padding-right: 1px;">Join Room</a></button>
    <button class="btn btn-join" onclick="window.open('http://github.com/dvnielzuniga/vaquita-split');"><a style="color: black; padding-left: 1px; padding-right: 1px;">Create Room</a></button>
  </div>
   <img class="protected" src="https://dvnielzuniga.github.io/VS_logo.png" alt="Snow" style="width:50%;">
</dialog>
</div>

</body>

<script>
  // Triggers instantly once the DOM is parsed
  // document.getElementById('splashModal').showModal();
  const modal = document.getElementById('splashModal');

    // Cerrar al hacer clic en el backdrop
    modal.addEventListener('click', (event) => {
    const rect = modal.getBoundingClientRect();
    const isInDialog = (
        event.clientX >= rect.left &&
        event.clientX <= rect.right &&
        event.clientY >= rect.top &&
        event.clientY <= rect.bottom
    );
    
    if (!isInDialog) {
        modal.close();
    }
    });

    // Abrir el modal al cargar
    modal.showModal();

</script>

</html>
