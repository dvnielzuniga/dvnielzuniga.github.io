<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaquita Split</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0B2A6F;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }

  .container {
    text-align: center;
  }

  /* LOGO ICON */
  .logo-icon {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
  }

  .logo-icon .yellow {
    position: absolute;
    width: 60px;
    height: 100px;
    background: #FFD60A;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    left: 30px;
  }

  .logo-icon .aqua {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 10px solid #1ED6C3;
    border-top: none;
    border-left: none;
    border-radius: 50%;
    transform: rotate(25deg);
  }

  /* TEXT */
  .title {
    color: white;
    font-size: 48px;
    font-weight: 600;
  }

  .subtitle {
    color: #1ED6C3;
    font-size: 32px;
    margin-bottom: 40px;
  }

  /* BUTTONS */
  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
  }

  .btn {
    padding: 16px 28px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* JOIN (secondary) */
  .btn-join {
    background: transparent;
    border: 2px solid #1ED6C3;
    color: white;
  }

  .btn-join:hover {
    background: rgba(30, 214, 195, 0.1);
    transform: scale(1.03);
  }

  /* CREATE (primary) */
  .btn-create {
    background: #1ED6C3;
    border: none;
    color: white;
  }

  .btn-create:hover {
    background: #18b8a9;
    transform: scale(1.05);
  }

</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo-icon">
    <div class="yellow"></div>
    <div class="aqua"></div>
  </div>

  <div class="title">Vaquita</div>
  <div class="subtitle">Split</div>

  <!-- BUTTONS -->
  <div class="buttons">
    <div class="btn btn-join">👥 Join Room</div>
    <div class="btn btn-create">＋ Create Room</div>
  </div>

</div>

</body>
</html>
