<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

    @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      :root {
        --blue:rgba(31, 107, 255, 1);
        --blue-dak:rgba(15, 78, 216, 1);
        --yellow:#ffd84d;
        --aqua:#23d7c6;
        --white:#ffffff;
      }

      body {
        margin: 0;
        padding:0;
        min-height: 100vh; /* Asegura que cubra toda la pantalla */

        /* 2. Aplicamos el degradado usando la variable */
        background: linear-gradient(var(--angle), rgba(31, 107, 255, 1), rgb(14, 145, 47));
        background-attachment: fixed; /* Evita que el fondo se mueva al hacer scroll */

        /* 3. Animación de 1 segundo en bucle infinito */
        animation: rotateBackground 10s ease-in-out infinite;
        font-family: Arial, Helvetica, sans-serif;
        /* background: linear-gradient(160deg, rgba(31, 107, 255, 1), rgba(15, 78, 216, 1)); */
        color: var(--white);
        display: flex;
        justify-content:center;
        align-items:center;
        height:100vh;
      }
      
      @keyframes rotateBackground {
        to {
          --angle: 360deg;
        }
      }
.container {
  position: absolute;
  text-align: center;
  color: white;
}
.centered {
  position: absolute;
  top: 75%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
}
button {
  padding: 10px 10px;
  border-radius: 45px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s ease;
  display: flex;
  align-items: center;
}

  /* JOIN (secondary) */
  .btn-join {
    background: transparent;
    border: 2px solid #1ED6C3;
    color: white;
}

  .btn-join:hover {
    background: rgba(30, 214, 195, 0.1);
    transform: scale(1.03);
  }

  /* CREATE (primary) */
  .btn-create {
    background: #1ED6C3;
    border: none;
    color: white;
  }

  .btn-create:hover {
    background: #adcf17;
    transform: scale(1.05);
  }
</style>
</head>
<body style="background-color:blue;">


<div class="container">
  <img src="https://dvnielzuniga.github.io/VS_logo.png" alt="Snow" style="width:100%;">
  
  <div class="centered">
  <div class="buttons">
  <button class="btn btn-join" onclick="window.open('http://www.instagram.com/dvnielzuniga');"><img  src="https://img.icons8.com/?size=30&id=32292&format=png&color=ffffff"></button>
    <button class="btn btn-join" onclick="window.open('http://github.com/dvnielzuniga/vaquita-split');"><img  src="https://img.icons8.com/?size=30&id=zehXPLJSAbBB&format=png&color=ffffff"></button>
  </div>
  </div>
</div>

</body>
</html>
