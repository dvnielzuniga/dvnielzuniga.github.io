<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* 1. ANIMATED BACKGROUND VARIABLES */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            --blue: #1f6bff;
            --dark-blue: #0e2291;
            --yellow: #ffd84d;
            --aqua: #23d7c6;
            --text-dark: #2c3e50;
        }

        /* 2. BODY & PROTECTION */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, var(--blue), var(--dark-blue));
            background-attachment: fixed;
            animation: rotateBackground 10s ease-in-out infinite;
            overflow: hidden;
            /* Keeps UI from moving */

            /* GLOBAL PROTECTION: No text selection */

            -webkit-user-drag: none;
        }

        @keyframes rotateBackground { to { --angle: 360deg; } }


        /* 3. CENTERED LAYOUT (THE HARMONY) */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 450px;
            /* Limits size on large screens */
            position: relative;
        }

        .main-logo {
            width: 100%;
            height: auto;
            /* IMAGE PROTECTION: No dragging */
            -webkit-user-drag: none;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
        }

        /* 4. SOCIAL BUTTONS (BOTTOM ALIGNED) */
        .social-row {
            display: flex;
            width: 80%;
            justify-content: center;
            gap: 20px;
            margin-top: -15%;
            /* Adjust this to place them exactly where you want */
            position: relative;
            /* REQUIRED for z-index to work */
            z-index: 10;
            /* Pulls buttons to the very front layer */
            pointer-events: all;
            /* Forces the browser to recognize clicks here */
        }

        .btn-social {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid var(--aqua);
            border-radius: 50%;
            /* Circle buttons */
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            transform: scale(0.9);
            /* Subtle "click" feel when pressed */
            filter: brightness(1.2);
        }

        .btn-social img {
            width: 24px;
            height: 24px;
            user-select: none;
            -webkit-user-drag: none;

            /* Keep it clickable */
            pointer-events: auto;
            cursor: pointer;
        }

        .btn-social:hover {
            background: var(--aqua);
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 0 15px var(--aqua);
        }

        /* 5. MODAL STYLING */
        #splashModal {
            border: none;
            border-radius: 15px;
            padding: .5rem .5rem;
            background: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            text-align: center;
            width: 320px;
            transition: all 0.3s ease;
        }

        #splashModal::backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
        }

        h2 { color: var(--text-dark); font-size: 2rem; margin: 0; }
        p.subtitle { color: #666; margin: 5px 0 25px 0; font-style: italic; }
        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .row { display: flex; gap: 10px; }

        /* --- INPUTS Y BOTONES --- */
        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 1rem;
        }

        .btn-modal {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .btn-primary { background: var(--aqua); color: white; }
        .btn-secondary { background: #f0f0f0; color: var(--text-dark); }
        .btn-enter { background: var(--blue); color: white; width: 100%; margin-top: 10px; }

        .btn-modal:hover { opacity: 0.9; transform: translateY(-2px); }

        .copy-label {
            background: #f8f9fa;
            border: 2px dashed var(--blue);
            padding: 15px;
            font-family: monospace;
            font-size: 1.2rem;
            color: var(--blue);
            margin: 10px 0;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: #e74c3c;
            margin-bottom: 10px;
        }
    </style>
    <body>

    <div class="content-wrapper">
        <!-- Logo -->
        <img src="https://dvnielzuniga.github.io/VS_logo.png" alt="Logo" class="main-logo">

        <!-- Social Icons Row -->
        <div class="social-row">
            <div class="btn-social" onclick="window.open('http://www.instagram.com/dvnielzuniga');">
                <img src="https://img.icons8.com/?size=30&id=32292&format=png&color=ffffff" alt="IG">
            </div>
            <div class="btn-social" onclick="window.open('http://github.com/dvnielzuniga/vaquita-split');">
                <img src="https://img.icons8.com/?size=30&id=zehXPLJSAbBB&format=png&color=ffffff" alt="GH">
            </div>
        </div>
    </div>
     <!-- Modal con contenido intercambiable -->
    <dialog id="splashModal">
        <div id="modalContent">
            <h2>Vaquita Split</h2>
            <p class="subtitle">Split smarter. Pay together.</p>
            
            <div class="modal-body">
                <div class="row">
                    <button class="btn-modal btn-secondary" onclick="showJoin()">Join Room</button>
                    <button class="btn-modal btn-primary" onclick="showCreate()">Create Room</button>
                </div>
            </div>
        </div>
    </dialog>

    <script>
        const modal = document.getElementById('splashModal');
        const content = document.getElementById('modalContent');

        // Mostrar modal al cargar
        window.onload = () => { modal.showModal(); };

        // Función para vista JOIN
        function showJoin() {
            content.innerHTML = `
                <h2>Join Room</h2>
                <p class="subtitle">Enter the details below</p>
                <div class="modal-body">
                    <input type="text" placeholder="Room Code (e.g. 1234)">
                    <input type="text" placeholder="Your Nickname">
                    <button class="btn-modal btn-enter" onclick="modal.close()">ENTER</button>
                    <button class="btn-modal btn-secondary" style="font-size: 0.7rem; padding: 5px;" onclick="resetModal()">← Back</button>
                </div>
            `;
        }

        // Función para vista CREATE
        function showCreate() {
            const randomCode = Math.floor(1000 + Math.random() * 9000); // Código aleatorio
            content.innerHTML = `
                <h2>Room Created</h2>
                <p class="subtitle">Share this with your friends</p>
                <div class="modal-body">
                    <div class="copy-label">${randomCode}</div>
                    <p class="disclaimer">⚠️ You cannot share this code with anyone outside your group.</p>
                    <button class="btn-modal btn-enter" onclick="modal.close()">ENTER ROOM</button>
                    <button class="btn-modal btn-secondary" style="font-size: 0.7rem; padding: 5px;" onclick="resetModal()">← Back</button>
                </div>
            `;
        }

        // Función para volver al inicio del modal
        function resetModal() {
            content.innerHTML = `
                <h2>Vaquita Split</h2>
                <p class="subtitle">Split smarter. Pay together.</p>
                <div class="modal-body">
                    <div class="row">
                        <button class="btn-modal btn-secondary" onclick="showJoin()">Join Room</button>
                        <button class="btn-modal btn-primary" onclick="showCreate()">Create Room</button>
                    </div>
                </div>
            `;
        }

        // Cerrar al clickear fuera
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.close();
        });
    </script>
</body>
</html>
